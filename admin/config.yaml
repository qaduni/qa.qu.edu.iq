# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: "qaduni/qa.qu.edu.iq"
  branch: "main"
  auth_methods:
    - token

media_folder: "static/media"
public_folder: "/media"

i18n:
  structure: multiple_files
  locales: ["ar", "en"]
  default_locale: ar

media_libraries:
  all:
    max_file_size: 5120000
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 85
      svg:
        optimize: true

site_url: "https://qa.qu.edu.iq/"
display_url: "https://qa.qu.edu.iq/"

collections:
  # ==========================================
  # CONTENT COLLECTIONS
  # ==========================================
  - name: "news"
    label: "الأخبار"
    label_singular: "خبر"
    icon: news
    description: "الاخبار تظهر في الصفحة الرئيسية ومركز الاخبار وتحتوي على غلاف."
    i18n: true
    folder: "content/media/news"
    path: "{{year}}/{{month}}/{{day}}/{{slug}}"
    preview_path: "media/news/{{year}}/{{month}}/{{day}}/{{slug}}"
    slug: "{{uuid_shorter}}"
    create: true
    sortable_fields:
      - "date"
      - "title"
    media_folder: "/static/media"
    public_folder: "/media"
    fields:
      - label: "العنوان"
        name: "title"
        widget: "string"
        required: true
        i18n: true
        pattern: &titlePattern
          - '^[a-zA-Z0-9\u0600-\u06FF\s.,،؟!:؛"''()«»\-]{10,75}$'
          - "يجب أن يكون العنوان بين 10 و 75 حرفًا."
      - label: "الوصف"
        name: "description"
        widget: "text"
        required: true
        i18n: true
        pattern: &descriptionPattern
          - '^[a-zA-Z0-9\u0600-\u06FF\s.,،؟!:؛"''()«»\-]{30,120}$'
          - "يجب أن يكون الوصف بين 30 و 120 حرفًا."
      - label: "الصورة"
        name: "image"
        widget: "image"
        required: false
        i18n: duplicate
      - label: "وصف الصورة"
        name: "imageAlt"
        widget: string
        i18n: true
        required: true
      - label: "التاريخ"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: "{{now}}"
        required: true
        i18n: duplicate
      - label: "المحتوى"
        name: "body"
        widget: "markdown"
        i18n: true


  - name: "announcements"
    label: "الإعلانات"
    label_singular: "إعلان"
    icon: brand_awareness
    description: "الإعلانات تظهر في الصفحة الرئيسية ومركز الاخبار ولا تحتوي على غلاف."
    i18n: true
    folder: "content/media/announcements"
    path: "{{year}}/{{month}}/{{day}}/{{slug}}"
    slug: "{{uuid_shorter}}"
    create: true
    sortable_fields:
      - "date"
      - "title"
    media_folder: "/static/media"
    public_folder: "/media"
    fields:
      - label: "العنوان"
        name: "title"
        widget: "string"
        required: true
        i18n: true
        pattern: *titlePattern
      - label: "الوصف"
        name: "description"
        widget: "text"
        required: true
        i18n: true
        pattern: *descriptionPattern
      - label: "النوع"
        name: "type"
        widget: select
        options: ["administrative", "academic", "students", "general"]
        i18n: duplicate
        required: true
      - label: "هل الاعلان مهم؟"
        name: "important"
        widget: "boolean"
        default: false
        i18n: duplicate
      - label: "المحتوى"
        name: "body"
        widget: "markdown"
        i18n: true
      - label: "التاريخ"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: "{{now}}"
        required: true
        i18n: duplicate
  - divider: true
  # ==========================================
  # CONTENT PAGES
  # ==========================================
  # Find the Arabic site context# Dynamically generate folder collections for top-level content directories
  - name: "about"
    label: "عن القسم"
    folder: "content/about"
    icon: article
    create: false
    i18n: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", required: false, i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
  - name: "accreditations"
    label: "الاعتمادات والعضويات"
    folder: "content/accreditations"
    icon: article
    create: false
    i18n: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", required: false, i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
  - name: "classifications"
    label: "التصنيفات"
    folder: "content/classifications"
    icon: article
    create: false
    i18n: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", required: false, i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
  - name: "lab-accreditation"
    label: "اعتماد المختبرات"
    folder: "content/lab-accreditation"
    icon: article
    create: false
    i18n: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", required: false, i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
  - name: "performance-evaluation"
    label: "تقويم الأداء"
    folder: "content/performance-evaluation"
    icon: article
    create: false
    i18n: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", required: false, i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
  - name: "policies"
    label: "السياسات واللوائح"
    folder: "content/policies"
    icon: article
    create: false
    i18n: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", required: false, i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
  # ==========================================
  # DATA FILE COLLECTIONS
  # ==========================================
  - divider: true
  - name: "settings"
    label: "الإعدادات العامة"
    icon: "settings"
    i18n:
      structure: multiple_files
    files:
      # ==========================================
      # 1. SITE INFO & GLOBAL SETTINGS (data/site/)
      # ==========================================
      - name: "site_info"
        label: "معلومات الموقع (Site Info)"
        file: "data/site/{{locale}}.yml"
        i18n: true
        fields:
          - { label: "عنوان الموقع", name: "title", widget: "string", i18n: true }
          - { label: "العنوان المختصر", name: "short_title", widget: "string", i18n: true }
          - { label: "الوصف", name: "description", widget: "text", i18n: true }
          - { label: "جهة الانتساب العليا", name: "parent_name", widget: "string", i18n: true }
          - { label: "العنوان الجغرافي", name: "address", widget: "string", i18n: true }

      - name: "site_global"
        label: "الإعدادات التقنية (Global Settings)"
        file: "data/site/global.yml"
        i18n: false
        fields:
          - { label: "رابط الجهة العليا", name: "parent_url", widget: "string" }
          - { label: "رابط خريطة المجمع", name: "campus_map_embed", widget: "string" }
          - { label: "الرابط الرسمي", name: "official_domain", widget: "string" }
          - { label: "تنبيه الانتقال للدومين الرسمي", name: "show_official_domain_notice", widget: "boolean", default: true }
          - { label: "البريد الإلكتروني الرسمي", name: "email", widget: "string" }
          - { label: "رقم الهاتف", name: "phone", widget: "string", required: false }
          - label: "روابط التواصل الاجتماعي"
            name: "social"
            widget: "object"
            required: false
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "Twitter / X", name: "twitter", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "Telegram", name: "telegram", widget: "string", required: false }
              - { label: "WhatsApp", name: "whatsapp", widget: "string", required: false }
              - { label: "TikTok", name: "tiktok", widget: "string", required: false }

      # ==========================================
      # 2. HOMEPAGE SETTINGS (data/homepage/)
      # ==========================================
      - name: "homepage"
        label: "محتوى الرئيسية (Homepage)"
        file: "data/homepage/{{locale}}.yml"
        i18n: true
        fields:
          - label: "قسم الهيرو (Hero)"
            name: "hero"
            widget: "object"
            i18n: true
            fields:
              - { label: "الشارة (Badge)", name: "badge", widget: "string", i18n: true }
              - { label: "العنوان الرئيسي", name: "title", widget: "string", i18n: true }
              - { label: "الوصف", name: "description", widget: "text", i18n: true }
              - label: "الأزرار"
                name: "buttons"
                widget: "object"
                fields:
                  - { label: "اسم الزر الأول", name: "primary_name", widget: "string", required: false, i18n: true }
                  - { label: "رابط الزر الأول", name: "primary_url", widget: "string", required: false, i18n: true }
                  - { label: "اسم الزر الثاني", name: "secondary_name", widget: "string", required: false, i18n: true }
                  - { label: "رابط الزر الثاني", name: "secondary_url", widget: "string", required: false, i18n: true }

          - label: "قسم الخدمات (Services)"
            name: "services"
            widget: "object"
            i18n: true
            fields:
              - { label: "عنوان القسم", name: "title", widget: "string", required: false, i18n: true }
              - { label: "العنوان الفرعي", name: "sub_title", widget: "string", required: false, i18n: true }
              - label: "عناصر الخدمات"
                name: "items"
                widget: "list"
                i18n: true
                fields:
                  - { label: "اسم الخدمة", name: "name", widget: "string", i18n: true }
                  - { label: "الترتيب", name: "weight", widget: "number", value_type: "int", i18n: duplicate }
                  - { label: "الرابط", name: "url", widget: "string", required: false, i18n: true }
                  - label: "خصائص إضافية"
                    name: "params"
                    widget: "object"
                    required: false
                    fields:
                      - { label: "أيقونة/صورة", name: "image", widget: "image", required: false, i18n: duplicate }
                      - { label: "الوصف المختصر", name: "description", widget: "text", required: false, i18n: true }

      # ==========================================
      # 3. MENUS SETTINGS (data/menus/)
      # ==========================================
      - name: "menus"
        label: "قوائم التنقل (Menus)"
        file: "data/menus/{{locale}}.yml"
        i18n: true
        fields:
          - label: "القائمة الرئيسية (Main Menu)"
            name: "main"
            widget: "list"
            i18n: true
            fields:
              - { label: "اسم العنصر", name: "name", widget: "string", i18n: true }
              - { label: "الترتيب (Weight)", name: "weight", widget: "number", value_type: "int", i18n: duplicate }
              - { label: "الرابط (URL)", name: "url", widget: "string", required: false, i18n: true }
              - { label: "المعرف (Identifier)", name: "identifier", widget: "string", required: false, i18n: duplicate }
              - { label: "العنصر الأب (Parent)", name: "parent", widget: "string", required: false, i18n: duplicate }

          - label: "الشريط العلوي (Top Bar)"
            name: "top_bar"
            widget: "list"
            i18n: true
            fields:
              - { label: "اسم الرابط", name: "name", widget: "string", i18n: true }
              - { label: "الترتيب", name: "weight", widget: "number", value_type: "int", i18n: duplicate }
              - { label: "الرابط", name: "url", widget: "string", i18n: true }
              - label: "إعدادات الرابط"
                name: "params"
                widget: "object"
                required: false
                fields:
                  - { label: "رابط خارجي؟", name: "external", widget: "boolean", default: false, required: false, i18n: duplicate }

      # ==========================================
      # 4. FOOTER SETTINGS (data/footer/)
      # ==========================================
      - name: "footer"
        label: "تذييل الصفحة (Footer)"
        file: "data/footer/{{locale}}.yml"
        i18n: true
        fields:
          - label: "روابط مفيدة"
            name: "footer_useful"
            widget: "list"
            i18n: true
            fields:
              - { label: "اسم الرابط", name: "name", widget: "string", i18n: true }
              - { label: "الترتيب", name: "weight", widget: "number", value_type: "int", i18n: duplicate }
              - { label: "الرابط", name: "url", widget: "string", i18n: true }

          - label: "روابط الخدمات"
            name: "footer_services"
            widget: "list"
            i18n: true
            fields:
              - { label: "اسم الخدمة", name: "name", widget: "string", i18n: true }
              - { label: "الترتيب", name: "weight", widget: "number", value_type: "int", i18n: duplicate }
              - { label: "الرابط", name: "url", widget: "string", i18n: true }
              - label: "إعدادات الرابط"
                name: "params"
                widget: "object"
                required: false
                fields:
                  - { label: "رابط خارجي؟", name: "external", widget: "boolean", default: false, required: false, i18n: duplicate }

          - label: "الروابط السفلية (حقوق / سياسات)"
            name: "footer_bottom"
            widget: "list"
            i18n: true
            fields:
              - { label: "اسم الرابط", name: "name", widget: "string", i18n: true }
              - { label: "الترتيب", name: "weight", widget: "number", value_type: "int", i18n: duplicate }
              - { label: "الرابط", name: "url", widget: "string", i18n: true }