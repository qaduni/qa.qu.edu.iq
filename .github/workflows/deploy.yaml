name: Build and Trigger Dokploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Submodules parameter removed

      # 1. Setup Go (Required for Hugo Modules)
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.21'

      # 2. Cache Hugo modules and build cache
      - name: Hugo Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/hugo_cache
            ~/go/pkg/mod
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/hugo.toml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      # 3. Cache Pagefind binary/npx cache
      - name: Pagefind Cache
        uses: actions/cache@v6
        with:
          path: ~/.npm/_npx
          key: ${{ runner.os }}-pagefind-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pagefind-

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Static Site
        run: hugo --gc --minify

      # 4. Generate Pagefind Search Index
      - name: Generate Pagefind Search Index
        run: npx --prefer-offline -y pagefind --site public

      - name: Deploy Compiled Files to Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./public
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'