services:
  title: "شعب القسم"
  sub_title: "الشعب والوحدات الرئيسية المكونة لقسم ضمان الجودة والأداء الجامعي"
  items:
    - name: "شعبة تقويم الأداء"
      weight: 10
      url: "/ar/performance-evaluation/"
      params:
        image: "media/tour-2.webp"
        description: "تُعنى بإعداد استمارات تقويم الأداء المؤسسي السنوية، ومتابعة تطبيقها في الكليات والمراكز، وتحليل النتائج وإصدار التقارير"

    - name: "شعبة الضمان"
      weight: 20
      url: "/ar/classifications/international/"
      params:
        image: "media/tour.webp"
        description: "مسؤولة عن متابعة تطبيق معايير ضمان الجودة، وإعداد الخطط التحسينية، وتفعيل ثقافة الجودة بين الكوادر التدريسية والإدارية"

    - name: "شعبة الاعتماد"
      weight: 30
      url: "/ar/accreditations/"
      params:
        image: "media/people.webp"
        description: "تتولى ملفات الاعتماد المؤسسي والبرامجي والمختبري، والتنسيق مع جهات الاعتماد المحلية والدولية، ومتابعة شهادات الـ ISO."

