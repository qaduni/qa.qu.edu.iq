  title: "قسم ضمان الجودة والأداء الجامعي"
  description: "نعمل على ترسيخ معايير الجودة الأكاديمية والمؤسسية وتطوير الأداء الجامعي في جميع كليات ومراكز جامعة القادسية."
  buttons:
    primary_name: "تعرف على القسم"
